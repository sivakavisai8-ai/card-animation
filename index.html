<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="A collection of eight favorite wedding memories.">
	<title>Wedding Memories</title>
	<link rel="stylesheet" href="./style.css">
</head>
<body>
	<main class="gallery-page">
		<header class="gallery-header">
			<p class="eyebrow">A DAY TO REMEMBER</p>
			<h1>Wedding <span>Memories</span></h1>
			<p class="intro">A few beautiful moments, kept close and cherished forever.</p>
		</header>

		<section class="gallery" aria-label="Wedding photo gallery">
			<figure class="photo-card">
				<img src="wedding-01.jpg" alt="Wedding memory 1" loading="eager">
				<figcaption><span>01</span> The celebration</figcaption>
			</figure>
			<figure class="photo-card">
				<img src="wedding-02.jpg" alt="Wedding memory 2" loading="lazy">
				<figcaption><span>02</span> A lovely moment</figcaption>
			</figure>
			<figure class="photo-card">
				<img src="wedding-03.jpg" alt="Wedding memory 3" loading="lazy">
				<figcaption><span>03</span> Together</figcaption>
			</figure>
			<figure class="photo-card">
				<img src="wedding-04.jpg" alt="Wedding memory 4" loading="lazy">
				<figcaption><span>04</span> The happy day</figcaption>
			</figure>
			<figure class="photo-card">
				<img src="wedding-05.jpg" alt="Wedding memory 5" loading="lazy">
				<figcaption><span>05</span> A moment to cherish</figcaption>
			</figure>
			<figure class="photo-card">
				<img src="wedding-06.jpg" alt="Wedding memory 6" loading="lazy">
				<figcaption><span>06</span> Joy and laughter</figcaption>
			</figure>
			<figure class="photo-card">
				<img src="wedding-07.jpg" alt="Wedding memory 7" loading="lazy">
				<figcaption><span>07</span> Surrounded by love</figcaption>
			</figure>
			<figure class="photo-card">
				<img src="wedding-08.jpg" alt="Wedding memory 8" loading="lazy">
				<figcaption><span>08</span> Forever memorable</figcaption>
			</figure>
		</section>

		<footer class="gallery-footer">Made with love · Eight memories, one beautiful day</footer>
	</main>
</body>
</html>
